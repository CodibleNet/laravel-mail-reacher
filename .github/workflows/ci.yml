name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
        laravel: ['10.*', '11.*', '12.*']
        exclude:
          - php: '8.1'
            laravel: '11.*'
          - php: '8.1'
            laravel: '12.*'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer config repositories.mail-reacher-php vcs https://github.com/CodibleNet/mail-reacher-php
      - run: composer config minimum-stability dev
      - run: composer config prefer-stable true
      - run: composer require --no-interaction --no-update illuminate/mail:${{ matrix.laravel }} illuminate/support:${{ matrix.laravel }}
      - uses: ramsey/composer-install@v3
      - run: composer validate --strict --no-check-lock
      - run: composer test
